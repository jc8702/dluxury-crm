name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET || 'test-jwt-secret-32chars-minimum-for-ci' }}
      APP_INIT_KEY: ${{ secrets.APP_INIT_KEY || 'test-init-key-32chars-minimum-for-ci' }}
      PLAYWRIGHT_BASE_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build

      - name: Start API server
        run: npm run dev:api &

      - name: Start dev server
        run: npm run dev &

      - name: Wait for servers
        run: npx wait-on http://localhost:3000 http://localhost:5173 --timeout 60000

      - name: Run E2E tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
