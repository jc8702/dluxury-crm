name: Neon Migrations

on:
  push:
    branches: [main]
    paths:
      - 'drizzle/**'
      - 'src/db/schema/**'
      - 'drizzle.config.ts'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run Drizzle migrations against Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          echo "Running Drizzle migrations..."
          npx drizzle-kit migrate
